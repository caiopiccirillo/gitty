[package]
name = "gitty"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
gix = { version = "0.86", default-features = false, features = ["status", "sha1"] }
ratatui = "0.30.2"
tree-sitter = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"

[dev-dependencies]
git2 = "0.21.0"
tempfile = "3.27.0"
