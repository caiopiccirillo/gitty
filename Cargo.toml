[package]
name = "gitty-tui"
version = "0.3.0"
edition = "2024"
description = "A terminal user interface for reviewing and staging git changes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/caiopiccirillo/gitty"
rust-version = "1.85"
keywords = ["git", "tui", "terminal", "staging", "diff"]
categories = ["command-line-utilities", "development-tools"]

# The crate is published as `gitty-tui` because `gitty` is taken on
# crates.io; the binary and the library keep the `gitty` name.
[[bin]]
name = "gitty"
path = "src/main.rs"

[lib]
name = "gitty"

[dependencies]
anyhow = "1.0.104"
gix = { version = "0.86", default-features = false, features = ["status", "sha1"] }
ratatui = "0.30.2"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }

[features]
# Tree-sitter syntax highlighting for code shown in diffs. Off by default
# to keep the build light (the grammars are compiled from C).
syntax = [
    "dep:tree-sitter",
    "dep:tree-sitter-json",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
]

[dev-dependencies]
git2 = "0.21.0"
tempfile = "3.27.0"

[lints.clippy]
all = "warn"       # Default rules
pedantic = "warn"  # Strict rules
# nursery = "warn"   # Experimental rules
